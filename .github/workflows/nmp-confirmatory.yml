name: TE1 NMP R1 Confirmatory 256G Temporary

on:
  push:
    branches:
      - diagnostic/nmp-r1-confirmatory-256g
  pull_request:

jobs:
  nmp-confirmatory-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - name: Verify authorized source
        run: python3 scripts/verify_repo_integrity.py
      - name: Hydrate NNUE assets
        run: python3 scripts/hydrate_repo_assets.py
      - name: Build release engine
        run: cargo build --release --locked -p te1-engine
      - name: Run non-overlapping NMP confirmatory shard
        env:
          SHARD: ${{ matrix.shard }}
          PYTHONPATH: .
        run: python3 .github/scripts/nmp_confirmatory.py
