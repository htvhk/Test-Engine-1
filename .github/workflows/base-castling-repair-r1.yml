name: TE1 Base B1 Castling Repair R1

on:
  push:
    branches:
      - repair/alpha26-base-castling-capture-r1

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate base lineage
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 1e750218f43fa5129cb82f19b107555a1343d878^{commit}
          git merge-base --is-ancestor 1e750218f43fa5129cb82f19b107555a1343d878 HEAD
          python3 scripts/verify_repo_integrity.py

      - name: Apply bounded shared capture-semantics repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/te1-chess/src/lib.rs")
          text = path.read_text(encoding="utf-8")

          old = '''#[must_use]
pub fn captured_piece(board: &Board, mv: Move) -> Option<Piece> {
    if let Some(piece) = board.piece_on(mv.to) {
        return Some(piece);
    }
    let is_en_passant = board.piece_on(mv.from) == Some(Piece::Pawn)
        && mv.from.file() != mv.to.file()
        && board.piece_on(mv.to).is_none();
    is_en_passant.then_some(Piece::Pawn)
}
'''
          new = '''#[must_use]
pub fn captured_piece(board: &Board, mv: Move) -> Option<Piece> {
    // cozy-chess represents castling internally as the king moving onto its
    // own rook square. Only a piece belonging to the opponent is a capture.
    if board.colors(!board.side_to_move()).has(mv.to) {
        return board.piece_on(mv.to);
    }
    let is_en_passant = board.piece_on(mv.from) == Some(Piece::Pawn)
        && mv.from.file() != mv.to.file()
        && board.piece_on(mv.to).is_none();
    is_en_passant.then_some(Piece::Pawn)
}
'''
          if text.count(old) != 1:
              raise SystemExit(f"captured_piece anchor count != 1: {text.count(old)}")
          text = text.replace(old, new, 1)

          anchor = '''    #[test]
    fn undo_restores_exact_fen() {
'''
          regression = '''    #[test]
    fn castling_capture_semantics_are_exact() {
        for (fen, castles) in [
            (
                "r3k2r/8/8/8/8/8/8/R3K2R w KQkq - 17 1",
                ["e1g1", "e1c1"],
            ),
            (
                "r3k2r/8/8/8/8/8/8/R3K2R b KQkq - 17 1",
                ["e8g8", "e8c8"],
            ),
        ] {
            let board = parse_board(fen).unwrap();
            for uci in castles {
                let mv = parse_legal_uci_move(&board, uci).unwrap();
                // Prove the regression fixture reaches cozy-chess's internal
                // king-to-own-rook castling representation.
                assert_eq!(board.piece_on(mv.to), Some(Piece::Rook));
                assert_eq!(captured_piece(&board, mv), None);
                assert!(!is_capture(&board, mv));
                assert!(!move_is_capture(&board, uci).unwrap());

                let game = Te1Game::from_fen(fen).unwrap();
                let mut position = SearchPosition::from_game(&game);
                let undo = position.make_move(mv);
                assert_eq!(position.halfmove_clock(), 18);
                position.unmake_move(undo);
                assert_eq!(position.halfmove_clock(), 17);
                assert_eq!(position.board(), &board);
            }
        }

        let capture_board = parse_board("7k/8/8/3q4/4P3/8/8/7K w - - 9 1").unwrap();
        let capture = parse_legal_uci_move(&capture_board, "e4d5").unwrap();
        assert_eq!(captured_piece(&capture_board, capture), Some(Piece::Queen));
        assert!(is_capture(&capture_board, capture));

        let ep_board = parse_board("7k/8/8/3pP3/8/8/8/7K w - d6 9 1").unwrap();
        let en_passant = parse_legal_uci_move(&ep_board, "e5d6").unwrap();
        assert_eq!(captured_piece(&ep_board, en_passant), Some(Piece::Pawn));
        assert!(is_capture(&ep_board, en_passant));
    }

'''
          if text.count(anchor) != 1:
              raise SystemExit(f"test insertion anchor count != 1: {text.count(anchor)}")
          text = text.replace(anchor, regression + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- crates/te1-chess/src/lib.rs

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1

      - name: Hydrate generated compile-time assets
        run: python3 scripts/hydrate_repo_assets.py

      - name: Focused regression
        run: cargo test -p te1-chess castling_capture_semantics_are_exact --locked

      - name: Mandatory Rust gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Enforce bounded write surface
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for path in "${changed[@]}"; do
            case "$path" in
              crates/te1-chess/src/lib.rs) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --check

      - name: Commit verified repair and remove one-shot executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "te1-base-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/te1-chess/src/lib.rs
          git rm .github/workflows/base-castling-repair-r1.yml
          git commit -m "Fix castling capture semantics"
          git push origin HEAD:repair/alpha26-base-castling-capture-r1
