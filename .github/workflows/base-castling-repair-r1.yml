name: TE1 Base B1 Castling Repair R1

on:
  push:
    branches:
      - repair/alpha26-base-castling-capture-r1

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate base lineage
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 1e750218f43fa5129cb82f19b107555a1343d878^{commit}
          git merge-base --is-ancestor 1e750218f43fa5129cb82f19b107555a1343d878 HEAD
          python3 scripts/verify_repo_integrity.py

      - name: Apply bounded shared capture-semantics repair
        shell: bash
        env:
          OLD_B64: 
          NEW_B64: 
          ANCHOR_B64: ICAgICNbdGVzdF0KICAgIGZuIHVuZG9fcmVzdG9yZXNfZXhhY3RfZmVuKCkgewo=
          REGRESSION_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path("crates/te1-chess/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          old = base64.b64decode(os.environ["OLD_B64"]).decode()
          new = base64.b64decode(os.environ["NEW_B64"]).decode()
          anchor = base64.b64decode(os.environ["ANCHOR_B64"]).decode()
          regression = base64.b64decode(os.environ["REGRESSION_B64"]).decode()
          if text.count(old) != 1:
              raise SystemExit(f"captured_piece anchor count != 1: {text.count(old)}")
          if text.count(anchor) != 1:
              raise SystemExit(f"test insertion anchor count != 1: {text.count(anchor)}")
          text = text.replace(old, new, 1).replace(anchor, regression + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- crates/te1-chess/src/lib.rs

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1

      - name: Hydrate generated compile-time assets
        run: python3 scripts/hydrate_repo_assets.py

      - name: Focused regression
        run: cargo test -p te1-chess castling_capture_semantics_are_exact --locked

      - name: Mandatory Rust gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Enforce bounded write surface
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for path in "${changed[@]}"; do
            case "$path" in
              crates/te1-chess/src/lib.rs) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --check

      - name: Commit verified repair and remove one-shot executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "te1-base-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/te1-chess/src/lib.rs
          git rm .github/workflows/base-castling-repair-r1.yml
          git commit -m "Fix castling capture semantics"
          git push origin HEAD:repair/alpha26-base-castling-capture-r1
