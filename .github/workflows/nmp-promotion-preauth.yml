name: TE1 NMP Promotion Pre-Authorization

on:
  push:
    branches:
      - promotion/alpha26-nmp-default-on

permissions:
  contents: read

jobs:
  authenticate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate bounded production promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "649bd2ced314a1ad2f6470fc9a59cb20446c4809"
          test "$(git hash-object crates/te1-engine/src/main.rs)" = "1fce4cc17eb680cb79ffe0e366c8d29b1cb15514"
          test "$(git diff --name-only 649bd2ced314a1ad2f6470fc9a59cb20446c4809 HEAD)" = ".github/workflows/nmp-promotion-preauth.yml"
          grep -F 'use_null_move_pruning: true,' crates/te1-engine/src/main.rs
          grep -F 'option name UseNullMovePruning type check default true' crates/te1-engine/src/main.rs
          SHA256="$(sha256sum crates/te1-engine/src/main.rs | awk '{print $1}')"
          printf 'TE1_NMP_PROMOTION_SOURCE_COMMIT=%s\n' '649bd2ced314a1ad2f6470fc9a59cb20446c4809'
          printf 'TE1_NMP_PROMOTION_SOURCE_TREE=%s\n' 'e2aabb52c21c62ab8e3bfdefa4f3e9a5efe7c09e'
          printf 'TE1_NMP_PROMOTION_ENGINE_BLOB=%s\n' '1fce4cc17eb680cb79ffe0e366c8d29b1cb15514'
          printf 'TE1_NMP_PROMOTION_ENGINE_SHA256=%s\n' "$SHA256"
