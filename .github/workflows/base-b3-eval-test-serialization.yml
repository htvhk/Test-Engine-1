name: TE1 Base B3 Evaluator Test Serialization

on:
  push:
    branches:
      - repair/alpha26-base-classical-default-r2

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate authorized B3-R2 head
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e ff3427619d4a8461792f439bde73e9e1d3e8d942^{commit}
          git merge-base --is-ancestor ff3427619d4a8461792f439bde73e9e1d3e8d942 HEAD
          python3 scripts/verify_repo_integrity.py

      - name: Serialize evaluator-mutating engine tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/te1-engine/src/main.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  '''mod tests {\n    use super::*;\n\n''',
                  '''mod tests {\n    use super::*;\n    use std::sync::Mutex;\n\n    static EVAL_TEST_LOCK: Mutex<()> = Mutex::new(());\n\n''',
              ),
              (
                  '''    fn production_default_is_classical_and_nnue_remains_opt_in() {\n        let default_options = EngineOptions::default();\n''',
                  '''    fn production_default_is_classical_and_nnue_remains_opt_in() {\n        let _guard = EVAL_TEST_LOCK.lock().unwrap();\n        let default_options = EngineOptions::default();\n''',
              ),
              (
                  '''    fn failed_eval_file_restore_preserves_hybrid_mode() {\n        let mut options = EngineOptions {\n''',
                  '''    fn failed_eval_file_restore_preserves_hybrid_mode() {\n        let _guard = EVAL_TEST_LOCK.lock().unwrap();\n        let mut options = EngineOptions {\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"serialization anchor count != 1: {count} for {old[:70]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- crates/te1-engine/src/main.rs

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1

      - name: Hydrate generated compile-time assets
        run: python3 scripts/hydrate_repo_assets.py

      - name: Stress evaluator-mutating engine tests
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 20); do
            cargo test -p te1-engine --locked -- --test-threads=8 >/tmp/te1-engine-test.log 2>&1 || {
              cat /tmp/te1-engine-test.log
              exit 1
            }
          done
          cat /tmp/te1-engine-test.log

      - name: Mandatory Rust gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Enforce bounded write surface
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for path in "${changed[@]}"; do
            case "$path" in
              crates/te1-engine/src/main.rs) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --check

      - name: Commit verified source checkpoint and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "te1-base-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/te1-engine/src/main.rs
          git rm .github/workflows/base-b3-eval-test-serialization.yml
          git commit -m "Serialize evaluator-mutating engine tests"
          git push origin HEAD:repair/alpha26-base-classical-default-r2
