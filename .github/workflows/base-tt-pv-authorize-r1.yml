name: TE1 Base B2 TT PV Authorization R1

on:
  push:
    branches:
      - repair/alpha26-base-tt-pv-r1

permissions:
  contents: write

jobs:
  authorize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate frozen B2 source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=a9739a52c6869707fab580b4622a15ee231e680a
          TREE=b2de3b67fcb13c588f63e9327c859780f40a9b2d
          test "$(git rev-parse "$SOURCE^{tree}")" = "$TREE"
          git merge-base --is-ancestor "$SOURCE" HEAD
          git diff --quiet "$SOURCE" -- crates/te1-search/src/lib.rs

      - name: Authorize exact te1-search bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import subprocess

          source = "a9739a52c6869707fab580b4622a15ee231e680a"
          tree = "b2de3b67fcb13c588f63e9327c859780f40a9b2d"
          target = "crates/te1-search/src/lib.rs"
          auth_path = Path("EXPERIMENTAL_SOURCE_AUTHORIZATION.json")
          auth = json.loads(auth_path.read_text(encoding="utf-8"))

          before = json.loads(json.dumps(auth["production_files"]))
          data = Path(target).read_bytes()
          sha256 = hashlib.sha256(data).hexdigest()
          blob = subprocess.check_output(["git", "hash-object", target], text=True).strip()

          auth["authorized_checkpoint"] = {"commit": source, "tree": tree}
          auth["production_files"][target]["authorized_blob"] = blob
          auth["production_files"][target]["authorized_sha256"] = sha256

          for path, value in before.items():
              if path != target and auth["production_files"][path] != value:
                  raise SystemExit(f"unexpected authorization drift: {path}")
          if auth["production_files"][target]["baseline_sha256"] != before[target]["baseline_sha256"]:
              raise SystemExit("baseline hash changed")

          auth_path.write_text(json.dumps(auth, indent=2) + "\n", encoding="utf-8")
          print(f"B2 source sha256={sha256}")
          print(f"B2 source blob={blob}")
          PY
          git diff --check
          git diff -- EXPERIMENTAL_SOURCE_AUTHORIZATION.json

      - name: Verify canonical integrity with descendant authorization
        run: python3 scripts/verify_repo_integrity.py

      - name: Commit verified authorization and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "te1-base-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add EXPERIMENTAL_SOURCE_AUTHORIZATION.json
          git rm .github/workflows/base-tt-pv-authorize-r1.yml
          git commit -m "Authorize Base B2 TT PV source checkpoint"
          git push origin HEAD:repair/alpha26-base-tt-pv-r1
