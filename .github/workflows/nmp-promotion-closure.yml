name: TE1 NMP Promotion Rustfmt Receipt

on:
  push:
    branches:
      - promotion/alpha26-nmp-default-on

permissions:
  contents: write
  statuses: write

jobs:
  rustfmt-receipt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Produce authenticated rustfmt blob without changing branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          STAGE='bootstrap'
          report_fail() {
            local target="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?te1_nmp_rustfmt=fail&stage=${STAGE}"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state='failure' \
              -f context='te1/nmp-promotion-rustfmt-receipt' \
              -f description="NMP rustfmt receipt failed at ${STAGE}" \
              -f target_url="$target"
          }
          trap 'rc=$?; report_fail; exit $rc' ERR

          STAGE='authenticate-input'
          test "$(git hash-object crates/te1-engine/src/main.rs)" = "1fce4cc17eb680cb79ffe0e366c8d29b1cb15514"

          STAGE='rust-toolchain'
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup override set 1.97.1

          STAGE='rustfmt'
          cargo fmt --all
          test "$(git diff --name-only)" = "crates/te1-engine/src/main.rs"

          STAGE='publish-blob'
          SHA256="$(sha256sum crates/te1-engine/src/main.rs | awk '{print $1}')"
          python3 - <<'PY' > /tmp/te1-rustfmt-blob.json
          import json
          from pathlib import Path
          print(json.dumps({
              'content': Path('crates/te1-engine/src/main.rs').read_text(encoding='utf-8'),
              'encoding': 'utf-8',
          }))
          PY
          BLOB="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/te1-rustfmt-blob.json --jq '.sha')"
          test -n "$BLOB"
          TARGET="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?te1_nmp_rustfmt=pass&formatted_blob=${BLOB}&sha256=${SHA256}"
          trap - ERR
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state='success' \
            -f context='te1/nmp-promotion-rustfmt-receipt' \
            -f description='NMP rustfmt blob authenticated' \
            -f target_url="$TARGET"
