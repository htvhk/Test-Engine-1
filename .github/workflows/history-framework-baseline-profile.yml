name: TE1 Alpha 2.6 History Framework Baseline Profile

on:
  push:
    branches:
      - diagnostic/alpha26-history-framework-baseline-profile

permissions:
  contents: read

env:
  BASE_COMMIT: 1e750218f43fa5129cb82f19b107555a1343d878
  BASE_TREE: df59aa937bbff6736af25304ca990a69d06ae49f
  SEARCH_BLOB: cd393b65085cdfa1b327f00f23c69f61763fcb2e
  SEARCH_SHA256: 943cd3320e0538b5e30763ebc1858cbe0fd53d94b6f9c31a1fc0b6364e397a26
  ENGINE_BLOB: b2facdb682c7841e1b3c77db43dffdcc7fb59fcd
  ENGINE_SHA256: 61c0b03d3bd274f281a5c375cd0f3b3dd37f48adca4c2fcc42e477471e867f7d

jobs:
  profile:
    if: github.event.head_commit.message == 'Run History Framework baseline profile diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate production baseline and diagnostic-only branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse "$BASE_COMMIT^{tree}")" = "$BASE_TREE"
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          test "$(git hash-object crates/te1-search/src/lib.rs)" = "$SEARCH_BLOB"
          test "$(git hash-object crates/te1-engine/src/main.rs)" = "$ENGINE_BLOB"
          test "$(sha256sum crates/te1-search/src/lib.rs | awk '{print $1}')" = "$SEARCH_SHA256"
          test "$(sha256sum crates/te1-engine/src/main.rs | awk '{print $1}')" = "$ENGINE_SHA256"
          python3 scripts/verify_repo_integrity.py
          python3 - <<'PY'
          import subprocess

          base = '1e750218f43fa5129cb82f19b107555a1343d878'
          allowed = {
              '.github/diagnostic_sources/history_framework_baseline_profile.rs.txt',
              '.github/scripts/history_framework_baseline_profile_patch.py',
              '.github/scripts/history_framework_production_parity.py',
              '.github/scripts/history_framework_profile_parse.py',
              '.github/workflows/history-framework-baseline-profile.yml',
              'diagnostics/history_framework/HISTORY_FRAMEWORK_BASELINE_PROFILE_TRIGGER.md',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base, 'HEAD'], text=True
          ).splitlines())
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f'unexpected pre-profile paths: {unexpected}')
          if 'crates/te1-search/src/lib.rs' in changed or 'crates/te1-engine/src/main.rs' in changed:
              raise SystemExit('production source was modified before profiling transaction')
          PY

      - name: Install pinned Rust
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup override set 1.97.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Hydrate assets and verify canonical Python gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/hydrate_repo_assets.py
          python3 -m unittest python.tests.test_r3_attribution_campaign -v
          python3 -m py_compile \
            .github/scripts/history_framework_baseline_profile_patch.py \
            .github/scripts/history_framework_production_parity.py \
            .github/scripts/history_framework_profile_parse.py

      - name: Build frozen production control executable before instrumentation
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build --release --locked -p te1-engine --bin te1
          cp target/release/te1 /tmp/te1-production-control
          test -x /tmp/te1-production-control
          sha256sum /tmp/te1-production-control

      - name: Apply exact instrumentation-only profiling transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/history_framework_baseline_profile_patch.py
          mkdir -p crates/te1-engine/src/bin
          cp .github/diagnostic_sources/history_framework_baseline_profile.rs.txt \
            crates/te1-engine/src/bin/history_framework_baseline_profile.rs
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          python3 - <<'PY'
          import subprocess

          expected = {
              'crates/te1-search/src/lib.rs',
              'crates/te1-engine/src/main.rs',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines())
          if changed != expected:
              raise SystemExit(
                  f'instrumentation transaction changed wrong tracked paths: {sorted(changed)}'
              )
          PY

      - name: Run mandatory Rust gates on instrumented diagnostic source
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Prove frozen production equals instrumented OFF executable
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build --release --locked -p te1-engine --bin te1 --bin history_framework_baseline_profile
          cp target/release/te1 /tmp/te1-instrumented-off
          test -x /tmp/te1-instrumented-off
          python3 .github/scripts/history_framework_production_parity.py \
            /tmp/te1-production-control \
            /tmp/te1-instrumented-off \
            /tmp/history-framework-production-parity.json
          python3 - <<'PY'
          import json
          p = json.load(open('/tmp/history-framework-production-parity.json', encoding='utf-8'))
          assert p['schema'] == 'TE1-ALPHA26-HISTORY-FRAMEWORK-PRODUCTION-PARITY-v1'
          assert p['status'] == 'PASS'
          assert p['positions'] == 10
          PY

      - name: Run deterministic instrumented OFF-vs-ON neutrality and profile suite
        shell: bash
        run: |
          set -Eeuo pipefail
          ./target/release/history_framework_baseline_profile \
            | tee /tmp/history-framework-baseline-profile.txt
          test "$(grep -c '^TE1_HISTORY_FRAMEWORK_BASELINE_META' /tmp/history-framework-baseline-profile.txt)" -eq 1
          test "$(grep -c '^TE1_HISTORY_FRAMEWORK_BASELINE_PROFILE' /tmp/history-framework-baseline-profile.txt)" -eq 10

      - name: Parse and validate authenticated Gate B v2 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          RESULT='diagnostics/history_framework/ALPHA26_HISTORY_FRAMEWORK_BASELINE_PROFILE.json'
          RAW='/tmp/history-framework-baseline-profile.txt'
          PARITY='/tmp/history-framework-production-parity.json'
          python3 .github/scripts/history_framework_profile_parse.py \
            "$RAW" "$RESULT" "$GITHUB_SHA" "$PARITY"
          python3 - "$RESULT" <<'PY'
          import json, sys
          obj = json.load(open(sys.argv[1], encoding='utf-8'))
          assert obj['schema'] == 'TE1-ALPHA26-HISTORY-FRAMEWORK-BASELINE-PROFILE-v2'
          assert obj['gate'] == 'B'
          assert obj['decision'] == 'PASS'
          assert obj['neutrality_contract']['status'] == 'PASS'
          assert obj['neutrality_contract']['production_vs_instrumented_off']['status'] == 'PASS'
          assert obj['neutrality_contract']['instrumented_off_vs_instrumented_on']['status'] == 'PASS'
          assert len(obj['rows']) == 10
          assert obj['aggregate']['quiet_ordering_reads'] > 0
          assert obj['aggregate']['continuation_reads'] > 0
          assert obj['aggregate']['capture_history_reads'] > 0
          PY
          cp "$RAW" diagnostics/history_framework/ALPHA26_HISTORY_FRAMEWORK_BASELINE_PROFILE.raw.txt
          cp "$PARITY" diagnostics/history_framework/ALPHA26_HISTORY_FRAMEWORK_PRODUCTION_PARITY.json
          sha256sum \
            "$RESULT" \
            diagnostics/history_framework/ALPHA26_HISTORY_FRAMEWORK_BASELINE_PROFILE.raw.txt \
            diagnostics/history_framework/ALPHA26_HISTORY_FRAMEWORK_PRODUCTION_PARITY.json

      - name: Upload authenticated Gate B v2 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: alpha26-history-framework-baseline-profile-v2
          path: |
            diagnostics/history_framework/ALPHA26_HISTORY_FRAMEWORK_BASELINE_PROFILE.json
            diagnostics/history_framework/ALPHA26_HISTORY_FRAMEWORK_BASELINE_PROFILE.raw.txt
            diagnostics/history_framework/ALPHA26_HISTORY_FRAMEWORK_PRODUCTION_PARITY.json
          if-no-files-found: error
