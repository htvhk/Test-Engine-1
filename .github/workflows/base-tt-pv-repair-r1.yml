name: TE1 Base B2 TT PV Repair R1

on:
  push:
    branches:
      - repair/alpha26-base-tt-pv-r1

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate exact production base
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e c8cbde0085eec41f3a9e1699ec0ed123b6db9d55^{commit}
          git merge-base --is-ancestor c8cbde0085eec41f3a9e1699ec0ed123b6db9d55 HEAD
          python3 scripts/verify_repo_integrity.py

      - name: Apply bounded TT PV reconstruction repair
        shell: bash
        env:
          OLD_MATCH_B64: 
          NEW_MATCH_B64: 
          HELPER_ANCHOR_B64: Zm4gcHZfdG9fdWNpKHJvb3Q6ICZTZWFyY2hQb3NpdGlvbiwgcHY6ICZQdkxpbmUpIC0+IFZlYzxTdHJpbmc+IHsK
          HELPER_B64: 
          TEST_ANCHOR_B64: ICAgICNbdGVzdF0KICAgIGZuIG51bGxfcHJ1bmluZ19kaXNhYmxlZF9pc190aGVfZXhhY3RfZGV0ZXJtaW5pc3RpY19iYXNlbGluZSgpIHsK
          TEST_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path("crates/te1-search/src/lib.rs")
          text = path.read_text(encoding="utf-8")
          items = [
              ("match", os.environ["OLD_MATCH_B64"], os.environ["NEW_MATCH_B64"]),
              ("helper", os.environ["HELPER_ANCHOR_B64"], os.environ["HELPER_B64"] + os.environ["HELPER_ANCHOR_B64"]),
              ("test", os.environ["TEST_ANCHOR_B64"], os.environ["TEST_B64"] + os.environ["TEST_ANCHOR_B64"]),
          ]
          for label, old_b64, new_b64 in items:
              old = base64.b64decode(old_b64).decode()
              new = base64.b64decode(new_b64).decode()
              if text.count(old) != 1:
                  raise SystemExit(f"{label} anchor count != 1: {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- crates/te1-search/src/lib.rs

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1

      - name: Hydrate generated compile-time assets
        run: python3 scripts/hydrate_repo_assets.py

      - name: Focused warm-TT PV regression
        run: cargo test -p te1-search warm_exact_tt_preserves_full_deterministic_pv --locked

      - name: Mandatory Rust gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Enforce bounded write surface
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          for path in "${changed[@]}"; do
            case "$path" in
              crates/te1-search/src/lib.rs) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          git diff --check

      - name: Commit verified source checkpoint and remove executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "te1-base-repair-bot"
          git config user.email "actions@users.noreply.github.com"
          git add crates/te1-search/src/lib.rs
          git rm .github/workflows/base-tt-pv-repair-r1.yml
          git commit -m "Preserve PV across exact TT cutoffs"
          git push origin HEAD:repair/alpha26-base-tt-pv-r1
