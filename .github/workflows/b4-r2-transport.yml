name: TE1 Alpha 2.6 B4-R2 Exact Patch Transport

on:
  push:
    branches:
      - diagnostic/alpha26-b4-r2-transport

permissions:
  contents: write
  issues: read

env:
  BASE: fc3be2f9dc922db64db20aab78e6ae5d93cbde58
  BASE_TREE: fb22d75c382ecd6b89e0fdbdd7edd8142065bdd0
  COMMENT_ID: '5427773125'
  PATCH_SHA256: 001c118ed87b32c9703d579bd0720fec7a4a189243f6e895683870cdbf0f7b9c
  PATCH_BYTES: '13457'
  CANDIDATE_TREE: dc77bd91c609606a63b0dfa1d02e788efffa9a47
  CANDIDATE_BRANCH: candidate/alpha26-b4-r2-fast-see

jobs:
  transport-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate transport branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = "$BASE_TREE"
          python3 scripts/verify_repo_integrity.py
          mapfile -t changed < <(git diff --name-only "$BASE...HEAD")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/b4-r2-transport.yml"
          test "$(git hash-object crates/te1-search/src/lib.rs)" = "536a9bb287a2aaacdad4cfe795382552d971260a"

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1
          rustc --version --verbose
          cargo --version

      - name: Fetch exact persisted Codex patch from issue comment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          cid = os.environ["COMMENT_ID"]
          url = f"https://api.github.com/repos/{repo}/issues/comments/{cid}"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req) as r:
              body = json.load(r)["body"]
          marker = "```patch\n"
          start = body.index(marker) + len(marker)
          end = body.index("\n```", start)
          data = (body[start:end] + "\n").encode("utf-8")
          expected_n = int(os.environ["PATCH_BYTES"])
          expected_h = os.environ["PATCH_SHA256"]
          actual_h = hashlib.sha256(data).hexdigest()
          if len(data) != expected_n:
              raise SystemExit(f"patch byte-count mismatch: {len(data)} != {expected_n}")
          if actual_h != expected_h:
              raise SystemExit(f"patch SHA-256 mismatch: {actual_h} != {expected_h}")
          open("/tmp/TE1-B4-R2.patch", "wb").write(data)
          print(f"PATCH AUTHENTICATION PASS bytes={len(data)} sha256={actual_h}")
          PY

      - name: Apply patch in clean exact-baseline worktree and authenticate tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/te1-b4-r2-candidate
          git worktree add --detach /tmp/te1-b4-r2-candidate "$BASE"
          cd /tmp/te1-b4-r2-candidate
          git config user.name "TE1 B4-R2 Transport"
          git config user.email "te1-b4-r2@users.noreply.github.com"
          git am /tmp/TE1-B4-R2.patch
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          test "$(git diff --name-only "$BASE" HEAD)" = "crates/te1-search/src/lib.rs"
          test "$(git show "$BASE:Cargo.lock" | sha256sum | awk '{print $1}')" = "$(sha256sum Cargo.lock | awk '{print $1}')"
          git diff --check "$BASE" HEAD
          echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "candidate commit: $(git rev-parse HEAD)"
          echo "candidate tree: $(git rev-parse HEAD^{tree})"

      - name: Hydrate candidate assets
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-b4-r2-candidate
          python3 scripts/hydrate_repo_assets.py

      - name: Focused SEE differential tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-b4-r2-candidate
          cargo test -p te1-search --locked fast_see -- --nocapture
          cargo test -p te1-search --locked

      - name: Full Rust gates on exact candidate tree
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-b4-r2-candidate
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          git diff --check "$BASE" HEAD

      - name: Deterministic release bench twice
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-b4-r2-candidate
          cargo run --release --locked -p te1-engine -- bench | tee /tmp/b4-r2-bench-1.txt
          cargo run --release --locked -p te1-engine -- bench | tee /tmp/b4-r2-bench-2.txt
          sig1="$(sed -n 's/.* signature //p' /tmp/b4-r2-bench-1.txt | tail -n1)"
          sig2="$(sed -n 's/.* signature //p' /tmp/b4-r2-bench-2.txt | tail -n1)"
          test -n "$sig1"
          test "$sig1" = "$sig2"
          echo "bench signature: $sig1"

      - name: Push only verified candidate tree
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-b4-r2-candidate
          current="$(git rev-parse HEAD)"
          test "$current" = "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git push --force-with-lease origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "PERSISTED $CANDIDATE_BRANCH commit=$current tree=$CANDIDATE_TREE"
