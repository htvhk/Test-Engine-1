name: TE1 Alpha 2.6 Base Semantic Probes R1

on:
  push:
    branches:
      - diagnostic/alpha26-base-semantic-probes-r1

permissions:
  contents: read

env:
  BASE: fc3be2f9dc922db64db20aab78e6ae5d93cbde58
  BASE_TREE: fb22d75c382ecd6b89e0fdbdd7edd8142065bdd0

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate diagnostic branch and exact production base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = "$BASE_TREE"
          mapfile -t changed < <(git diff --name-only "$BASE...HEAD")
          printf '%s\n' "${changed[@]}" | sort
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/diagnostic_sources/base_semantic_probes.rs.txt'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/base-semantic-probes.yml'
          rm -rf /tmp/te1-base-semantic
          git worktree add --detach /tmp/te1-base-semantic "$BASE"
          cd /tmp/te1-base-semantic
          python3 scripts/verify_repo_integrity.py
          test "$(git hash-object crates/te1-chess/src/lib.rs)" = '9dc11cb77e1c7c4876e7a3f27c2f75eff8e254cc'
          test "$(git hash-object crates/te1-search/src/lib.rs)" = '536a9bb287a2aaacdad4cfe795382552d971260a'
          test "$(git hash-object crates/te1-engine/src/main.rs)" = 'd65e2790e74d76894c5e35385ac0c4ae0831e310'

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1

      - name: Hydrate exact production worktree
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-base-semantic
          python3 scripts/hydrate_repo_assets.py

      - name: Install diagnostic runner as untracked temporary bin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/te1-base-semantic/crates/te1-tools/src/bin
          cp .github/diagnostic_sources/base_semantic_probes.rs.txt /tmp/te1-base-semantic/crates/te1-tools/src/bin/base_semantic_probes.rs
          cd /tmp/te1-base-semantic
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Mandatory compile and workspace gates with temporary runner
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-base-semantic
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Execute semantic probes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-base-semantic
          CARGO_TARGET_DIR=/tmp/te1-base-semantic-target cargo run --release --locked -p te1-tools --bin base_semantic_probes | tee /tmp/base_semantic_probes.txt
          grep -F 'TE1_SEMANTIC_PROBE castling_next_fen PASS' /tmp/base_semantic_probes.txt
          grep -F 'TE1_SEMANTIC_PROBE repetition_history_key DEFECT' /tmp/base_semantic_probes.txt
          grep -F 'TE1_SEMANTIC_PROBE policy_toggle_summary' /tmp/base_semantic_probes.txt
          sha256sum /tmp/base_semantic_probes.txt

      - name: Enforce temporary write surface
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-base-semantic
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')
          for path in "${changed[@]}"; do
            case "$path" in
              crates/te1-tools/src/bin/base_semantic_probes.rs) ;;
              *) echo "unexpected temporary path: $path" >&2; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: alpha26-base-semantic-probes-r1
          path: /tmp/base_semantic_probes.txt
          if-no-files-found: error
          retention-days: 14
