name: TE1 Rust 1.98 Compatibility and Performance

on:
  push:
    branches:
      - diagnostic/rust-1.98-compat-performance-r1

permissions:
  contents: read

env:
  BASE: cc41a368cdca4704e99f7900f651ab9d0943552a
  BASE_TREE: 4fb022a8da00ade0c2c76a85c506c6e257708be1

jobs:
  compat-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate exact production and diagnostic-only surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = "$BASE_TREE"
          mapfile -t changed < <(git diff --name-only "$BASE...HEAD")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/rust-1.98-compat-performance.yml'
          rm -rf /tmp/te1-rust198
          git worktree add --detach /tmp/te1-rust198 "$BASE"
          cd /tmp/te1-rust198
          python3 scripts/verify_repo_integrity.py
          python3 scripts/hydrate_repo_assets.py

      - name: Apply one temporary Rust-1.98-compatible parser form
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-rust198
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/te1-nnue/src/lib.rs')
          text = p.read_text()
          old = '''            for pair in payload.chunks_exact(2) {
                let quantized = i16::from_le_bytes([pair[0], pair[1]]);
                values.push(f32::from(quantized) * scale);
            }
'''
          new = '''            let (pairs, remainder) = payload.as_chunks::<2>();
            debug_assert!(remainder.is_empty());
            for pair in pairs {
                let quantized = i16::from_le_bytes(*pair);
                values.push(f32::from(quantized) * scale);
            }
'''
          if text.count(old) != 1:
              raise SystemExit('NNUE parser anchor count != 1')
          p.write_text(text.replace(old, new))
          PY
          test "$(git diff --name-only)" = 'crates/te1-nnue/src/lib.rs'
          git diff --check

      - name: Install Rust 1.97.1 and 1.98.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustc +1.97.1 --version --verbose
          rustc +1.98.0 --version --verbose

      - name: Full repository gates under both compilers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-rust198
          for tc in 1.97.1 1.98.0; do
            cargo +"$tc" fmt --all -- --check
            cargo +"$tc" check --workspace --all-targets --locked
            cargo +"$tc" clippy --workspace --all-targets --locked -- -D warnings
            cargo +"$tc" test --workspace --locked
          done
          git diff --check

      - name: Build identical candidate source with both compilers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-rust198
          CARGO_TARGET_DIR=/tmp/te1-target-197 cargo +1.97.1 build --release --locked -p te1-engine
          CARGO_TARGET_DIR=/tmp/te1-target-198 cargo +1.98.0 build --release --locked -p te1-engine
          sha256sum /tmp/te1-target-197/release/te1 /tmp/te1-target-198/release/te1

      - name: Compare deterministic semantics and paired bench performance
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-rust198
          python3 - <<'PY'
          import json, re, statistics, subprocess, time
          from pathlib import Path
          bins = {'1.97.1': Path('/tmp/te1-target-197/release/te1'), '1.98.0': Path('/tmp/te1-target-198/release/te1')}
          rows=[]; signatures={k:[] for k in bins}; nps={k:[] for k in bins}
          orders=[('1.97.1','1.98.0'),('1.98.0','1.97.1')]*5
          for pair_idx, order in enumerate(orders):
              for version in order:
                  start=time.perf_counter()
                  proc=subprocess.run([str(bins[version]),'bench'],text=True,capture_output=True,check=True)
                  wall_ms=(time.perf_counter()-start)*1000.0
                  line=next((x for x in proc.stdout.splitlines() if 'info string bench depth ' in x),None)
                  if line is None: raise SystemExit(f'missing bench line {version}: {proc.stdout!r}')
                  ms=re.search(r' signature (.+)$',line); mn=re.search(r' nps (\d+) ',line)
                  if not ms or not mn: raise SystemExit(f'malformed bench line {version}: {line}')
                  sig=ms.group(1); speed=int(mn.group(1)); signatures[version].append(sig); nps[version].append(speed)
                  rows.append({'pair':pair_idx,'version':version,'signature':sig,'nps':speed,'wall_ms':round(wall_ms,3)})
          all_sigs=set(signatures['1.97.1']+signatures['1.98.0'])
          if len(all_sigs)!=1: raise SystemExit(f'deterministic signature drift: {signatures}')
          med197=statistics.median(nps['1.97.1']); med198=statistics.median(nps['1.98.0']); ratio=med198/med197 if med197 else 0.0
          report={'schema':'TE1-RUST-1.98-COMPAT-PERF-v2','base':'cc41a368cdca4704e99f7900f651ab9d0943552a','temporary_source_change':'chunks_exact(2) -> as_chunks::<2>() with empty remainder assertion','signature':next(iter(all_sigs)),'rust_1_97_1_nps':nps['1.97.1'],'rust_1_98_0_nps':nps['1.98.0'],'median_nps_1_97_1':med197,'median_nps_1_98_0':med198,'median_ratio_1_98_over_1_97':ratio,'rows':rows,'semantic_parity':True}
          Path('/tmp/rust-1.98-compat-performance.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print(json.dumps({k:report[k] for k in ['signature','median_nps_1_97_1','median_nps_1_98_0','median_ratio_1_98_over_1_97','semantic_parity']},sort_keys=True))
          PY
          sha256sum /tmp/rust-1.98-compat-performance.json

      - name: Restore and verify exact production worktree
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-rust198
          git restore crates/te1-nnue/src/lib.rs
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$BASE"
          python3 scripts/verify_repo_integrity.py

      - uses: actions/upload-artifact@v4
        with:
          name: rust-1.98-compat-performance-${{ github.sha }}
          path: /tmp/rust-1.98-compat-performance.json
          if-no-files-found: error
          retention-days: 14
