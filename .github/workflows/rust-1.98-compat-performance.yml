name: TE1 Rust 1.98 Compatibility and Performance

on:
  push:
    branches:
      - diagnostic/rust-1.98-compat-performance-r1

permissions:
  contents: read

env:
  BASE: cc41a368cdca4704e99f7900f651ab9d0943552a
  BASE_TREE: 4fb022a8da00ade0c2c76a85c506c6e257708be1

jobs:
  compat-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate exact production and diagnostic-only surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = "$BASE_TREE"
          mapfile -t changed < <(git diff --name-only "$BASE...HEAD")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/rust-1.98-compat-performance.yml'
          rm -rf /tmp/te1-rust198
          git worktree add --detach /tmp/te1-rust198 "$BASE"
          cd /tmp/te1-rust198
          python3 scripts/verify_repo_integrity.py
          python3 scripts/hydrate_repo_assets.py

      - name: Install Rust 1.97.1 and 1.98.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustc +1.97.1 --version --verbose
          rustc +1.98.0 --version --verbose

      - name: Full Rust 1.98 repository gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-rust198
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 check --workspace --all-targets --locked
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.98.0 test --workspace --locked
          git diff --check

      - name: Build exact production with both compilers
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-rust198
          CARGO_TARGET_DIR=/tmp/te1-target-197 cargo +1.97.1 build --release --locked -p te1-engine
          CARGO_TARGET_DIR=/tmp/te1-target-198 cargo +1.98.0 build --release --locked -p te1-engine
          sha256sum /tmp/te1-target-197/release/te1 /tmp/te1-target-198/release/te1

      - name: Compare deterministic semantics and paired bench performance
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-rust198
          python3 - <<'PY'
          import json, re, statistics, subprocess, time
          from pathlib import Path

          bins = {
              '1.97.1': Path('/tmp/te1-target-197/release/te1'),
              '1.98.0': Path('/tmp/te1-target-198/release/te1'),
          }
          rows = []
          signatures = {k: [] for k in bins}
          nps = {k: [] for k in bins}
          # Alternate order to reduce runner drift bias.
          orders = [
              ('1.97.1','1.98.0'), ('1.98.0','1.97.1'),
              ('1.97.1','1.98.0'), ('1.98.0','1.97.1'),
              ('1.97.1','1.98.0'), ('1.98.0','1.97.1'),
          ]
          for pair_idx, order in enumerate(orders):
              for version in order:
                  start = time.perf_counter()
                  proc = subprocess.run([str(bins[version]), 'bench'], text=True, capture_output=True, check=True)
                  wall_ms = (time.perf_counter() - start) * 1000.0
                  line = next((x for x in proc.stdout.splitlines() if 'info string bench depth ' in x), None)
                  if line is None:
                      raise SystemExit(f'missing bench line for {version}: {proc.stdout!r}')
                  m_sig = re.search(r' signature (.+)$', line)
                  m_nps = re.search(r' nps (\d+) ', line)
                  if not m_sig or not m_nps:
                      raise SystemExit(f'malformed bench line for {version}: {line}')
                  sig = m_sig.group(1)
                  speed = int(m_nps.group(1))
                  signatures[version].append(sig)
                  nps[version].append(speed)
                  rows.append({'pair': pair_idx, 'version': version, 'signature': sig, 'nps': speed, 'wall_ms': round(wall_ms,3)})

          all_sigs = set(signatures['1.97.1'] + signatures['1.98.0'])
          if len(all_sigs) != 1:
              raise SystemExit(f'deterministic signature drift: {signatures}')
          med197 = statistics.median(nps['1.97.1'])
          med198 = statistics.median(nps['1.98.0'])
          ratio = med198 / med197 if med197 else 0.0
          report = {
              'schema': 'TE1-RUST-1.98-COMPAT-PERF-v1',
              'base': 'cc41a368cdca4704e99f7900f651ab9d0943552a',
              'signature': next(iter(all_sigs)),
              'rust_1_97_1_nps': nps['1.97.1'],
              'rust_1_98_0_nps': nps['1.98.0'],
              'median_nps_1_97_1': med197,
              'median_nps_1_98_0': med198,
              'median_ratio_1_98_over_1_97': ratio,
              'rows': rows,
              'semantic_parity': True,
          }
          out = Path('/tmp/rust-1.98-compat-performance.json')
          out.write_text(json.dumps(report, sort_keys=True, indent=2) + '\n')
          print(json.dumps({k: report[k] for k in ['signature','median_nps_1_97_1','median_nps_1_98_0','median_ratio_1_98_over_1_97','semantic_parity']}, sort_keys=True))
          PY
          sha256sum /tmp/rust-1.98-compat-performance.json

      - name: Verify production worktree remained untouched
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-rust198
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(git rev-parse HEAD)" = "$BASE"
          python3 scripts/verify_repo_integrity.py

      - uses: actions/upload-artifact@v4
        with:
          name: rust-1.98-compat-performance-${{ github.sha }}
          path: /tmp/rust-1.98-compat-performance.json
          if-no-files-found: error
          retention-days: 14
