name: TE1 Adaptive LMR R1 Node Diagnostic

on:
  push:
    branches:
      - diagnostic/alpha26-adaptive-lmr-r1-node-suite

permissions:
  contents: write
  statuses: write

jobs:
  diagnostic:
    if: github.event.head_commit.message == 'Run adaptive LMR R1 node diagnostic'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build baseline and candidate, run deterministic node suite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          STAGE='bootstrap'
          BOOTSTRAP_SHA="$GITHUB_SHA"
          BASELINE='1e750218f43fa5129cb82f19b107555a1343d878'
          CANDIDATE_ID='fd9d8ae49ba269f21e53c5c9ad481d29cd67c70c'
          ENGINE_BLOB='f488aa099ef3534eaf835c295c9318a19ff2ea51'
          SEARCH_BLOB='a3261757e3a4ebb5eb840f355bd29b674fb09e24'
          RESULT='/tmp/ALPHA26_ADAPTIVE_LMR_R1_NODE_DIAGNOSTIC.json'

          fail_status() {
            local rc=$?
            local target="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}?te1_adaptive_lmr_node=fail&stage=${STAGE}"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${BOOTSTRAP_SHA}" \
              -f state='failure' \
              -f context='te1/adaptive-lmr-node-diagnostic' \
              -f description="Adaptive LMR node diagnostic failed at ${STAGE}" \
              -f target_url="$target" || true
            exit "$rc"
          }
          trap fail_status ERR

          STAGE='authenticate-candidate'
          git merge-base --is-ancestor "$CANDIDATE_ID" HEAD
          test "$(git hash-object crates/te1-engine/src/main.rs)" = "$ENGINE_BLOB"
          test "$(git hash-object crates/te1-search/src/lib.rs)" = "$SEARCH_BLOB"
          python3 scripts/verify_repo_integrity.py

          STAGE='toolchain'
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1

          STAGE='candidate-build'
          python3 scripts/hydrate_repo_assets.py
          CARGO_TARGET_DIR=/tmp/te1-candidate-target cargo build -p te1-engine --release --locked
          CANDIDATE_ENGINE='/tmp/te1-candidate-target/release/te1'
          test -x "$CANDIDATE_ENGINE"

          STAGE='baseline-worktree'
          git worktree add --detach /tmp/te1-baseline "$BASELINE"
          python3 /tmp/te1-baseline/scripts/verify_repo_integrity.py
          python3 /tmp/te1-baseline/scripts/hydrate_repo_assets.py
          (
            cd /tmp/te1-baseline
            CARGO_TARGET_DIR=/tmp/te1-baseline-target cargo build -p te1-engine --release --locked
          )
          BASELINE_ENGINE='/tmp/te1-baseline-target/release/te1'
          test -x "$BASELINE_ENGINE"

          STAGE='node-diagnostic'
          set +e
          python3 .github/scripts/adaptive_lmr_r1_node_diagnostic.py \
            --baseline-engine "$BASELINE_ENGINE" \
            --candidate-engine "$CANDIDATE_ENGINE" \
            --output "$RESULT"
          DIAG_RC=$?
          set -e
          test -s "$RESULT"
          DECISION="$(python3 -c 'import json; print(json.load(open("/tmp/ALPHA26_ADAPTIVE_LMR_R1_NODE_DIAGNOSTIC.json"))["decision"])')"

          STAGE='publish-evidence'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p diagnostics/adaptive_lmr
          cp "$RESULT" diagnostics/adaptive_lmr/ALPHA26_ADAPTIVE_LMR_R1_NODE_DIAGNOSTIC.json
          git rm .github/scripts/adaptive_lmr_r1_node_diagnostic.py .github/workflows/adaptive-lmr-r1-node-diagnostic.yml
          git add diagnostics/adaptive_lmr/ALPHA26_ADAPTIVE_LMR_R1_NODE_DIAGNOSTIC.json
          git commit -m "Record adaptive LMR R1 node diagnostic: ${DECISION}"
          FINAL_COMMIT="$(git rev-parse HEAD)"
          git push origin HEAD:diagnostic/alpha26-adaptive-lmr-r1-node-suite

          TARGET="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}?te1_adaptive_lmr_node=complete&decision=${DECISION}"
          trap - ERR
          if [ "$DIAG_RC" -eq 0 ]; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_COMMIT}" \
              -f state='success' \
              -f context='te1/adaptive-lmr-node-diagnostic' \
              -f description="Adaptive LMR node diagnostic complete: ${DECISION}" \
              -f target_url="$TARGET"
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${FINAL_COMMIT}" \
              -f state='failure' \
              -f context='te1/adaptive-lmr-node-diagnostic' \
              -f description="Adaptive LMR node diagnostic blocked: ${DECISION}" \
              -f target_url="$TARGET"
            exit "$DIAG_RC"
          fi
