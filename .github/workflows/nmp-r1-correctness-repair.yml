name: TE1 NMP R1 Correctness Repair

on:
  push:
    branches:
      - repair/alpha26-nmp-r1-correctness

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Add temporary NMP correctness repair workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/alpha26-nmp-r1-correctness
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - name: Apply exact bounded repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          BASE = 'cd5b6666c58d82a51e58132d419bc316b1415ee6'
          BASE_TREE = 'cc49436f8f936f453e03c52b8b20c0bd4ab08714'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exact replacement count 1, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'crates/te1-engine/src/main.rs',
              '''        "usenullmovepruning" => {\n            options.use_null_move_pruning = parse_bool(value, "UseNullMovePruning")?;\n        }''',
              '''        "usenullmovepruning" => {\n            let enabled = parse_bool(value, "UseNullMovePruning")?;\n            if enabled != options.use_null_move_pruning {\n                options.use_null_move_pruning = enabled;\n                effects.clear_hash = true;\n            }\n        }''',
          )

          replace_once(
              'crates/te1-engine/src/main.rs',
              '''    #[test]\n    fn null_move_pruning_option_defaults_off_and_can_be_enabled() {\n        let mut options = EngineOptions::default();\n        assert!(!options.use_null_move_pruning);\n        let effects =\n            set_option("setoption name UseNullMovePruning value true", &mut options).unwrap();\n        assert!(options.use_null_move_pruning);\n        assert_eq!(effects, OptionEffects::default());\n        assert!(options.search_options().use_null_move_pruning);\n    }''',
              '''    #[test]\n    fn null_move_pruning_toggle_clears_tt_only_on_value_change() {\n        let mut options = EngineOptions::default();\n        assert!(!options.use_null_move_pruning);\n\n        let effects =\n            set_option("setoption name UseNullMovePruning value true", &mut options).unwrap();\n        assert!(options.use_null_move_pruning);\n        assert_eq!(\n            effects,\n            OptionEffects {\n                clear_hash: true,\n                reload_eval: false,\n            }\n        );\n        assert!(options.search_options().use_null_move_pruning);\n\n        let same =\n            set_option("setoption name UseNullMovePruning value true", &mut options).unwrap();\n        assert_eq!(same, OptionEffects::default());\n\n        let effects =\n            set_option("setoption name UseNullMovePruning value false", &mut options).unwrap();\n        assert!(!options.use_null_move_pruning);\n        assert_eq!(\n            effects,\n            OptionEffects {\n                clear_hash: true,\n                reload_eval: false,\n            }\n        );\n        assert!(!options.search_options().use_null_move_pruning);\n    }''',
          )

          replace_once(
              'crates/te1-search/src/lib.rs',
              '''        if can_try_null && let Some(undo) = position.make_null_move() {''',
              '''        if can_try_null\n            && has_legal_moves(position.board())\n            && let Some(undo) = position.make_null_move()\n        {''',
          )

          marker = '''    #[test]\n    fn null_pruning_handles_terminal_ep_and_node_limit_paths() {'''
          test = '''    #[test]\n    fn null_pruning_never_prunes_non_pawn_stalemate() {\n        let fen = "k7/n1K5/8/8/8/8/8/R7 b - - 0 1";\n        let board = parse_board(fen).unwrap();\n        assert!(board.checkers().is_empty());\n        assert!(has_null_move_material(&board));\n        assert!(!has_legal_moves(&board));\n\n        let options = SearchOptions {\n            use_null_move_pruning: true,\n            ..SearchOptions::default()\n        };\n        let beta = -10_000;\n        let static_eval = te1_eval::evaluate(&board);\n        assert!(null_move_eligible(\n            options,\n            &board,\n            5,\n            beta,\n            false,\n            false,\n            false,\n            static_eval,\n        ));\n\n        let score = |enabled| {\n            let game = Te1Game::from_fen(fen).unwrap();\n            let mut position = SearchPosition::from_game(&game);\n            let shared = Arc::new(SharedControl {\n                stop: Arc::new(AtomicBool::new(false)),\n                total_nodes: AtomicU64::new(0),\n                node_limit: None,\n                deadline: None,\n            });\n            let mut worker = Worker {\n                id: 0,\n                shared,\n                table: Arc::new(TranspositionTable::with_megabytes(4)),\n                options: SearchOptions {\n                    use_null_move_pruning: enabled,\n                    ..SearchOptions::default()\n                },\n                histories: HistoryTables::default(),\n                stats: WorkerStats::default(),\n                aborted: false,\n            };\n            let mut pv = PvLine::default();\n            worker.negamax(\n                &mut position,\n                5,\n                1,\n                beta - 1,\n                beta,\n                false,\n                None,\n                false,\n                &mut pv,\n            )\n        };\n\n        assert_eq!(score(false), 0);\n        assert_eq!(score(true), 0);\n    }\n\n'''
          p = Path('crates/te1-search/src/lib.rs')
          text = p.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('search test insertion marker drift')
          p.write_text(text.replace(marker, test + marker, 1), encoding='utf-8')

          auth_path = Path('EXPERIMENTAL_SOURCE_AUTHORIZATION.json')
          auth = json.loads(auth_path.read_text(encoding='utf-8'))
          if auth.get('schema') != 'TE1-POST-B2-SOURCE-AUTHORIZATION-v1':
              raise SystemExit('authorization schema drift')
          if auth.get('immutable_baseline_commit') != 'f0ad93ad1940b964c513fc56175c7f907b114be9':
              raise SystemExit('immutable baseline authorization drift')
          checkpoint_tree = subprocess.check_output(
              ['git', 'rev-parse', f'{BASE}^{{tree}}'], text=True
          ).strip()
          if checkpoint_tree != BASE_TREE:
              raise SystemExit(f'canonical repair base tree drift: {checkpoint_tree}')
          auth['authorized_checkpoint'] = {'commit': BASE, 'tree': BASE_TREE}

          for rel in ('crates/te1-engine/src/main.rs', 'crates/te1-search/src/lib.rs'):
              entry = auth['production_files'].get(rel)
              if not entry or 'baseline_sha256' not in entry:
                  raise SystemExit(f'missing prior authorization entry: {rel}')
              data = Path(rel).read_bytes()
              entry['authorized_sha256'] = hashlib.sha256(data).hexdigest()
              entry['authorized_blob'] = subprocess.check_output(
                  ['git', 'hash-object', rel], text=True
              ).strip()

          auth_path.write_text(json.dumps(auth, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Verify exact scope before tests
        shell: bash
        run: |
          test "$(git rev-parse ${{ github.event.before }})" = "cd5b6666c58d82a51e58132d419bc316b1415ee6" || true
          git diff --check
          git diff --exit-code cd5b6666c58d82a51e58132d419bc316b1415ee6 -- Cargo.lock
          changed="$(git diff --name-only cd5b6666c58d82a51e58132d419bc316b1415ee6 -- crates/te1-engine/src/main.rs crates/te1-search/src/lib.rs EXPERIMENTAL_SOURCE_AUTHORIZATION.json)"
          printf '%s\n' "$changed"
          test "$changed" = $'EXPERIMENTAL_SOURCE_AUTHORIZATION.json\ncrates/te1-engine/src/main.rs\ncrates/te1-search/src/lib.rs'
      - name: Candidate-tree integrity and hydration
        run: |
          python3 scripts/verify_repo_integrity.py
          python3 scripts/hydrate_repo_assets.py
      - name: Focused regressions
        run: |
          cargo test -p te1-engine --locked null_move_pruning_toggle_clears_tt_only_on_value_change
          cargo test -p te1-search --locked null_pruning_never_prunes_non_pawn_stalemate
          cargo test -p te1-search --locked null_pruning
      - name: Full locked Rust gates
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          git diff --check
          git diff --exit-code cd5b6666c58d82a51e58132d419bc316b1415ee6 -- Cargo.lock
      - name: Commit clean repair and self-remove workflow
        shell: bash
        run: |
          git rm .github/workflows/nmp-r1-correctness-repair.yml
          git config user.name 'TE1 Repair Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add EXPERIMENTAL_SOURCE_AUTHORIZATION.json crates/te1-engine/src/main.rs crates/te1-search/src/lib.rs
          git diff --cached --check
          git commit -m 'Repair NMP toggle and stalemate correctness'
          git push origin HEAD:repair/alpha26-nmp-r1-correctness
