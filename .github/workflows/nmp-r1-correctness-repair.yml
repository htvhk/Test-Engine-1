name: TE1 NMP R1 Correctness Repair
on:
  pull_request:
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'repair/alpha26-nmp-r1-correctness'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/alpha26-nmp-r1-correctness
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
          rustup component add rustfmt clippy --toolchain 1.97.1
      - name: Apply exact repair and authorization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          BASE='cd5b6666c58d82a51e58132d419bc316b1415ee6'; TREE='cc49436f8f936f453e03c52b8b20c0bd4ab08714'
          def rep(path,old,new):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n!=1: raise SystemExit(f'{path}: replacement count {n}')
              p.write_text(s.replace(old,new,1))
          rep('crates/te1-engine/src/main.rs',
          '''        "usenullmovepruning" => {\n            options.use_null_move_pruning = parse_bool(value, "UseNullMovePruning")?;\n        }''',
          '''        "usenullmovepruning" => {\n            let enabled = parse_bool(value, "UseNullMovePruning")?;\n            if enabled != options.use_null_move_pruning {\n                options.use_null_move_pruning = enabled;\n                effects.clear_hash = true;\n            }\n        }''')
          rep('crates/te1-engine/src/main.rs',
          '''    #[test]\n    fn null_move_pruning_option_defaults_off_and_can_be_enabled() {\n        let mut options = EngineOptions::default();\n        assert!(!options.use_null_move_pruning);\n        let effects =\n            set_option("setoption name UseNullMovePruning value true", &mut options).unwrap();\n        assert!(options.use_null_move_pruning);\n        assert_eq!(effects, OptionEffects::default());\n        assert!(options.search_options().use_null_move_pruning);\n    }''',
          '''    #[test]\n    fn null_move_pruning_toggle_clears_tt_only_on_value_change() {\n        let mut options = EngineOptions::default();\n        assert!(!options.use_null_move_pruning);\n        let effects = set_option("setoption name UseNullMovePruning value true", &mut options).unwrap();\n        assert!(options.use_null_move_pruning);\n        assert_eq!(effects, OptionEffects { clear_hash: true, reload_eval: false });\n        assert!(options.search_options().use_null_move_pruning);\n        let same = set_option("setoption name UseNullMovePruning value true", &mut options).unwrap();\n        assert_eq!(same, OptionEffects::default());\n        let effects = set_option("setoption name UseNullMovePruning value false", &mut options).unwrap();\n        assert!(!options.use_null_move_pruning);\n        assert_eq!(effects, OptionEffects { clear_hash: true, reload_eval: false });\n        assert!(!options.search_options().use_null_move_pruning);\n    }''')
          rep('crates/te1-search/src/lib.rs',
          '        if can_try_null && let Some(undo) = position.make_null_move() {',
          '''        if can_try_null\n            && has_legal_moves(position.board())\n            && let Some(undo) = position.make_null_move()\n        {''')
          marker='''    #[test]\n    fn null_pruning_handles_terminal_ep_and_node_limit_paths() {'''
          test='''    #[test]\n    fn null_pruning_never_prunes_non_pawn_stalemate() {\n        let fen = "k7/n1K5/8/8/8/8/8/R7 b - - 0 1";\n        let board = parse_board(fen).unwrap();\n        assert!(board.checkers().is_empty());\n        assert!(has_null_move_material(&board));\n        assert!(!has_legal_moves(&board));\n        let options = SearchOptions { use_null_move_pruning: true, ..SearchOptions::default() };\n        let beta = -10_000;\n        let static_eval = te1_eval::evaluate(&board);\n        assert!(null_move_eligible(options, &board, 5, beta, false, false, false, static_eval));\n        let score = |enabled| {\n            let game = Te1Game::from_fen(fen).unwrap();\n            let mut position = SearchPosition::from_game(&game);\n            let shared = Arc::new(SharedControl {\n                stop: Arc::new(AtomicBool::new(false)), total_nodes: AtomicU64::new(0),\n                node_limit: None, deadline: None,\n            });\n            let mut worker = Worker {\n                id: 0, shared, table: Arc::new(TranspositionTable::with_megabytes(4)),\n                options: SearchOptions { use_null_move_pruning: enabled, ..SearchOptions::default() },\n                histories: HistoryTables::default(), stats: WorkerStats::default(), aborted: false,\n            };\n            let mut pv = PvLine::default();\n            worker.negamax(&mut position, 5, 1, beta - 1, beta, false, None, false, &mut pv)\n        };\n        assert_eq!(score(false), 0);\n        assert_eq!(score(true), 0);\n    }\n\n'''
          p=Path('crates/te1-search/src/lib.rs'); s=p.read_text()
          if s.count(marker)!=1: raise SystemExit('stalemate test marker drift')
          p.write_text(s.replace(marker,test+marker,1))
          actual=subprocess.check_output(['git','rev-parse',f'{BASE}^{{tree}}'],text=True).strip()
          if actual!=TREE: raise SystemExit('repair base tree drift')
          ap=Path('EXPERIMENTAL_SOURCE_AUTHORIZATION.json'); a=json.loads(ap.read_text())
          if a.get('schema')!='TE1-POST-B2-SOURCE-AUTHORIZATION-v1' or a.get('immutable_baseline_commit')!='f0ad93ad1940b964c513fc56175c7f907b114be9': raise SystemExit('authorization invariant drift')
          a['authorized_checkpoint']={'commit':BASE,'tree':TREE}
          for rel in ('crates/te1-engine/src/main.rs','crates/te1-search/src/lib.rs'):
              e=a['production_files'][rel]; data=Path(rel).read_bytes()
              e['authorized_sha256']=hashlib.sha256(data).hexdigest()
              e['authorized_blob']=subprocess.check_output(['git','hash-object',rel],text=True).strip()
          ap.write_text(json.dumps(a,indent=2)+'\n')
          PY
      - name: Verify repaired tree
        run: |
          git diff --check
          git diff --exit-code cd5b6666c58d82a51e58132d419bc316b1415ee6 -- Cargo.lock
          python3 scripts/verify_repo_integrity.py
          python3 scripts/hydrate_repo_assets.py
          cargo test -p te1-engine --locked null_move_pruning_toggle_clears_tt_only_on_value_change
          cargo test -p te1-search --locked null_pruning_never_prunes_non_pawn_stalemate
          cargo test -p te1-search --locked null_pruning
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          git diff --check
          git diff --exit-code cd5b6666c58d82a51e58132d419bc316b1415ee6 -- Cargo.lock
      - name: Commit clean repair
        run: |
          git rm .github/workflows/nmp-r1-correctness-repair.yml
          git config user.name 'TE1 Repair Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add EXPERIMENTAL_SOURCE_AUTHORIZATION.json crates/te1-engine/src/main.rs crates/te1-search/src/lib.rs
          git diff --cached --check
          git commit -m 'Repair NMP toggle and stalemate correctness'
          git push origin HEAD:repair/alpha26-nmp-r1-correctness
