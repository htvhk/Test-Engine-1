name: TE1 Alpha 2.6 GHI Product Falsification R1

on:
  push:
    branches:
      - diagnostic/alpha26-ghi-product-falsification-r1

permissions:
  contents: read

env:
  BASE: fc3be2f9dc922db64db20aab78e6ae5d93cbde58
  BASE_TREE: fb22d75c382ecd6b89e0fdbdd7edd8142065bdd0

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate diagnostic branch and exact production base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          test "$(git rev-parse "$BASE^{tree}")" = "$BASE_TREE"
          mapfile -t changed < <(git diff --name-only "$BASE...HEAD")
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/diagnostic_sources/ghi_product_falsification.rs.txt'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/ghi-product-falsification.yml'
          rm -rf /tmp/te1-ghi-product
          git worktree add --detach /tmp/te1-ghi-product "$BASE"
          cd /tmp/te1-ghi-product
          python3 scripts/verify_repo_integrity.py
          test "$(git hash-object crates/te1-chess/src/lib.rs)" = '9dc11cb77e1c7c4876e7a3f27c2f75eff8e254cc'
          test "$(git hash-object crates/te1-search/src/lib.rs)" = '536a9bb287a2aaacdad4cfe795382552d971260a'

      - name: Install pinned Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup override set 1.97.1

      - name: Hydrate exact production worktree
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-ghi-product
          python3 scripts/hydrate_repo_assets.py

      - name: Install temporary diagnostic runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/te1-ghi-product/crates/te1-tools/src/bin
          cp .github/diagnostic_sources/ghi_product_falsification.rs.txt /tmp/te1-ghi-product/crates/te1-tools/src/bin/ghi_product_falsification.rs
          cd /tmp/te1-ghi-product
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

      - name: Mandatory workspace gates
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-ghi-product
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Execute GHI product falsification
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-ghi-product
          CARGO_TARGET_DIR=/tmp/te1-ghi-product-target cargo run --release --locked -p te1-tools --bin ghi_product_falsification | tee /tmp/ghi_product_falsification.txt
          grep -F 'TE1_GHI_PRODUCT_SUMMARY' /tmp/ghi_product_falsification.txt
          sha256sum /tmp/ghi_product_falsification.txt

      - name: Enforce temporary write surface
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/te1-ghi-product
          mapfile -t changed < <(git status --porcelain=v1 --untracked-files=all | awk '{print $2}')
          for path in "${changed[@]}"; do
            case "$path" in
              crates/te1-tools/src/bin/ghi_product_falsification.rs) ;;
              *) echo "unexpected temporary path: $path" >&2; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: alpha26-ghi-product-falsification-r1
          path: /tmp/ghi_product_falsification.txt
          if-no-files-found: error
          retention-days: 14
