name: TE1 NMP Diagnostic Temporary

on:
  pull_request:

jobs:
  nmp-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - name: Verify authorized source
        run: python3 scripts/verify_repo_integrity.py
      - name: Hydrate NNUE assets
        run: python3 scripts/hydrate_repo_assets.py
      - name: Build release engine
        run: cargo build --release --locked -p te1-engine
      - name: NMP OFF vs ON fixed-depth diagnostic
        shell: bash
        run: |
          python3 - <<'PY'
          import json, queue, re, subprocess, threading, time
          from statistics import mean

          BIN = './target/release/te1'
          DEPTH = 6
          REPEATS = 2
          POSITIONS = [
              ('startpos', 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'),
              ('kiwipete', 'r3k2r/p1ppqpb1/bn2pnp1/2pP4/1p2P3/2N2N2/PPQBBPPP/R3K2R w KQkq - 0 1'),
              ('qgd', 'rnbq1rk1/pp2bppp/2p1pn2/3p4/2PP4/2N1PN2/PPQ1BPPP/R1B1K2R w KQ - 2 9'),
              ('semiopen', 'r1bq1rk1/pp1n1ppp/2pbpn2/8/2BP4/2N1PN2/PPQ2PPP/R1B1K2R w KQ - 4 9'),
              ('middlegame1', '2r2rk1/pp1bqppp/2np1n2/2p1p3/4P3/2PP1NP1/PP1N1PBP/R2QR1K1 w - - 2 13'),
              ('middlegame2', 'r2q1rk1/pp1bbppp/2np1n2/2p5/4P3/1NN1BP2/PPP3PP/R2Q1RK1 w - - 2 12'),
          ]

          info_re = re.compile(r'^info depth (\d+) seldepth (\d+) score cp (-?\d+) nodes (\d+) nps (\d+) hashfull (\d+) time (\d+)')
          q_re = re.compile(r'^info string threads (\d+) tthits (\d+) cutoffs (\d+) qnodes (\d+)')

          def start_reader(proc):
              outq = queue.Queue()
              def pump():
                  try:
                      for raw in proc.stdout:
                          outq.put(raw.rstrip('\n'))
                  finally:
                      outq.put(None)
              threading.Thread(target=pump, daemon=True).start()
              return outq

          def read_until(proc, outq, predicate, timeout=90):
              deadline = time.monotonic() + timeout
              lines = []
              while True:
                  remaining = deadline - time.monotonic()
                  if remaining <= 0:
                      raise RuntimeError(f'timeout; tail={lines[-20:]}')
                  try:
                      line = outq.get(timeout=min(1.0, remaining))
                  except queue.Empty:
                      if proc.poll() is not None:
                          raise RuntimeError(f'engine exited {proc.returncode}: {lines[-20:]}')
                      continue
                  if line is None:
                      raise RuntimeError(f'engine EOF: {lines[-20:]}')
                  lines.append(line)
                  if predicate(line):
                      return lines

          def send(proc, command):
              proc.stdin.write(command + '\n')
              proc.stdin.flush()

          def run_one(fen, enabled):
              p = subprocess.Popen([BIN], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                                   text=True, bufsize=1)
              outq = start_reader(p)
              try:
                  send(p, 'uci')
                  read_until(p, outq, lambda x: x == 'uciok')
                  send(p, 'setoption name UseNNUE value false')
                  send(p, 'setoption name Deterministic value true')
                  send(p, 'setoption name Threads value 1')
                  send(p, 'setoption name Hash value 16')
                  send(p, f'setoption name UseNullMovePruning value {str(enabled).lower()}')
                  send(p, 'isready')
                  read_until(p, outq, lambda x: x == 'readyok')
                  send(p, f'position fen {fen}')
                  send(p, f'go depth {DEPTH}')
                  lines = read_until(p, outq, lambda x: x.startswith('bestmove '))
                  info = None
                  qinfo = None
                  bestmove = None
                  for line in lines:
                      m = info_re.match(line)
                      if m:
                          info = m
                      qm = q_re.match(line)
                      if qm:
                          qinfo = qm
                      if line.startswith('bestmove '):
                          bestmove = line.split(maxsplit=1)[1]
                  if info is None or qinfo is None or not bestmove or bestmove == '0000':
                      raise RuntimeError(f'incomplete search output: {lines[-30:]}')
                  return {
                      'depth': int(info.group(1)), 'seldepth': int(info.group(2)), 'score': int(info.group(3)),
                      'nodes': int(info.group(4)), 'nps': int(info.group(5)), 'time_ms': int(info.group(7)),
                      'qnodes': int(qinfo.group(4)), 'tthits': int(qinfo.group(2)), 'cutoffs': int(qinfo.group(3)),
                      'bestmove': bestmove,
                  }
              finally:
                  if p.poll() is None:
                      try:
                          send(p, 'quit')
                          p.wait(timeout=5)
                      except Exception:
                          p.kill()

          rows = []
          for name, fen in POSITIONS:
              for enabled in (False, True):
                  runs = [run_one(fen, enabled) for _ in range(REPEATS)]
                  stable_fields = ('nodes', 'qnodes', 'score', 'bestmove', 'depth', 'seldepth')
                  for field in stable_fields:
                      values = {r[field] for r in runs}
                      if len(values) != 1:
                          raise RuntimeError(f'nondeterministic {name} enabled={enabled} field={field}: {values}')
                  row = dict(runs[0])
                  row['name'] = name
                  row['nmp'] = enabled
                  row['nps_mean'] = round(mean(r['nps'] for r in runs), 1)
                  row['time_ms_mean'] = round(mean(r['time_ms'] for r in runs), 1)
                  rows.append(row)
                  print('NMP_DIAG', json.dumps(row, sort_keys=True))

          off = {r['name']: r for r in rows if not r['nmp']}
          on = {r['name']: r for r in rows if r['nmp']}
          pairs = []
          for name, _ in POSITIONS:
              a, b = off[name], on[name]
              pairs.append({
                  'name': name,
                  'off_nodes': a['nodes'], 'on_nodes': b['nodes'],
                  'node_delta_pct': round((b['nodes'] - a['nodes']) * 100.0 / a['nodes'], 3),
                  'off_qnodes': a['qnodes'], 'on_qnodes': b['qnodes'],
                  'off_nps': a['nps_mean'], 'on_nps': b['nps_mean'],
                  'off_score': a['score'], 'on_score': b['score'],
                  'off_bestmove': a['bestmove'], 'on_bestmove': b['bestmove'],
              })
              print('NMP_PAIR', json.dumps(pairs[-1], sort_keys=True))

          total_off = sum(x['off_nodes'] for x in pairs)
          total_on = sum(x['on_nodes'] for x in pairs)
          summary = {
              'depth': DEPTH,
              'positions': len(POSITIONS),
              'repeats_per_mode': REPEATS,
              'total_off_nodes': total_off,
              'total_on_nodes': total_on,
              'total_node_delta_pct': round((total_on-total_off)*100.0/total_off, 3),
              'positions_reduced': sum(x['on_nodes'] < x['off_nodes'] for x in pairs),
              'positions_increased': sum(x['on_nodes'] > x['off_nodes'] for x in pairs),
              'mean_off_nps': round(mean(x['off_nps'] for x in pairs), 1),
              'mean_on_nps': round(mean(x['on_nps'] for x in pairs), 1),
          }
          print('NMP_SUMMARY', json.dumps(summary, sort_keys=True))
          PY
      - name: 32-game reversed-color NMP smoke
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts import r3_attribution_campaign as r3

          BIN = Path('./target/release/te1')
          NODES = 100_000
          MAX_PLIES = 200
          HASH_MB = 16

          def new_engine(enabled):
              engine = r3.UciEngine(BIN, 'CLASSICAL')
              engine.setoption('Hash', str(HASH_MB))
              engine.setoption('UseNullMovePruning', 'true' if enabled else 'false')
              if engine.evaluator_identity() != 'classical':
                  raise RuntimeError('smoke evaluator drifted from classical')
              return engine

          def play(opening_id, opening_moves, off_is_white):
              white = black = None
              try:
                  white = new_engine(not off_is_white)
                  black = new_engine(off_is_white)
                  white.setoption('Clear Hash')
                  black.setoption('Clear Hash')
                  moves = list(opening_moves)
                  history = [white.set_position(moves[:ply]) for ply in range(len(moves) + 1)]
                  black.set_position(moves)
                  result = '1/2-1/2'
                  termination = 'max-ply'
                  for _ in range(MAX_PLIES - len(moves)):
                      actor = white if len(moves) % 2 == 0 else black
                      fen = actor.set_position(moves)
                      reason = r3.draw_reason(history)
                      if reason and r3.has_legal_move(actor, moves, fen):
                          result = '1/2-1/2'
                          termination = reason
                          break
                      move, score = actor.bestmove(NODES)
                      if move == '0000':
                          if r3.has_legal_move(actor, moves, fen):
                              raise RuntimeError('bestmove 0000 with legal move available')
                          result = r3.terminal_result(fen, len(moves) % 2 == 0, score)
                          termination = 'checkmate' if result != '1/2-1/2' else 'stalemate'
                          break
                      moves.append(move)
                      history.append(white.set_position(moves))
                      black.set_position(moves)
                  off_result = 'D'
                  if result != '1/2-1/2':
                      white_won = result == '1-0'
                      off_result = 'W' if white_won == off_is_white else 'L'
                  return {
                      'id': f'{opening_id}-' + ('G1' if off_is_white else 'G2'),
                      'opening': opening_id,
                      'off_color': 'white' if off_is_white else 'black',
                      'result': result,
                      'off_result': off_result,
                      'plies': len(moves),
                      'termination': termination,
                  }
              finally:
                  if white is not None:
                      white.close()
                  if black is not None:
                      black.close()

          games = []
          for opening_id, text in r3.OPENING_MOVES:
              opening = text.split()
              games.append(play(opening_id, opening, True))
              games.append(play(opening_id, opening, False))
              print('NMP_SMOKE_PAIR', json.dumps(games[-2:], sort_keys=True))

          w = sum(g['off_result'] == 'W' for g in games)
          d = sum(g['off_result'] == 'D' for g in games)
          l = sum(g['off_result'] == 'L' for g in games)
          white = [g for g in games if g['off_color'] == 'white']
          black = [g for g in games if g['off_color'] == 'black']
          summary = {
              'games': len(games),
              'pairs': len(r3.OPENING_MOVES),
              'nodes_per_move': NODES,
              'max_plies': MAX_PLIES,
              'off_wdl': {'win': w, 'draw': d, 'loss': l},
              'off_score': w + 0.5 * d,
              'off_score_pct': round((w + 0.5 * d) * 100.0 / len(games), 3),
              'off_white_wdl': {
                  'win': sum(g['off_result'] == 'W' for g in white),
                  'draw': sum(g['off_result'] == 'D' for g in white),
                  'loss': sum(g['off_result'] == 'L' for g in white),
              },
              'off_black_wdl': {
                  'win': sum(g['off_result'] == 'W' for g in black),
                  'draw': sum(g['off_result'] == 'D' for g in black),
                  'loss': sum(g['off_result'] == 'L' for g in black),
              },
              'max_ply_draws': sum(g['termination'] == 'max-ply' for g in games),
              'total_plies': sum(g['plies'] for g in games),
          }
          if len(games) != 32 or summary['pairs'] != 16:
              raise RuntimeError(f'incomplete smoke campaign: {summary}')
          print('NMP_SMOKE_SUMMARY', json.dumps(summary, sort_keys=True))
          PY
